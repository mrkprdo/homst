events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    client_max_body_size 12M;

    # ── HTTPS (port 8443 — mapped to 8999 on host) ──
    server {
        listen 8443 ssl;
        server_name _;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Dev-only CSP: Vite injects inline scripts and evaluates modules, and
        # HMR talks to the dev server over a websocket.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: https:; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self';" always;

        ssl_certificate     /etc/ssl/homst/cert.pem;
        ssl_certificate_key /etc/ssl/homst/key.pem;

        # Root CA certificate — download from the settings panel so phones and
        # browsers can trust this server's local HTTPS certificate.
        location = /ca.pem {
            alias /etc/ssl/homst/ca.pem;
            default_type application/x-pem-file;
            add_header Content-Disposition 'attachment; filename="homst-ca.pem"' always;
        }

        location / {
            proxy_pass http://web-dev:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://api-dev:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }
    }
}
