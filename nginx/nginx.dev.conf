events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── HTTPS (port 8443 — mapped to 8999 on host) ──
    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/ssl/homst/cert.pem;
        ssl_certificate_key /etc/ssl/homst/key.pem;

        # Root CA certificate — download from the settings panel so phones and
        # browsers can trust this server's local HTTPS certificate.
        location = /ca.pem {
            alias /etc/ssl/homst/ca.pem;
            default_type application/x-pem-file;
            add_header Content-Disposition 'attachment; filename="homst-ca.pem"' always;
        }

        location / {
            proxy_pass http://web-dev:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://api-dev:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }
    }
}
