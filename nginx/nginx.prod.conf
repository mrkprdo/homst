events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    types {
        application/manifest+json webmanifest;
    }

    server_tokens off;

    client_max_body_size 12M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        application/xml;

    limit_req_zone $binary_remote_addr zone=homst_api:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=homst_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 8443 ssl http2;
        server_name _;

        ssl_certificate     /etc/ssl/homst/cert.pem;
        ssl_certificate_key /etc/ssl/homst/key.pem;

        error_page 497 =301 https://$host:$server_port$request_uri;

        root /usr/share/nginx/html;
        index index.html;

        location = /ca.pem {
            alias /etc/ssl/homst/ca.pem;
            default_type application/x-pem-file;
            add_header Content-Disposition 'attachment; filename="homst-ca.pem"' always;
        }

        resolver 127.0.0.11 valid=10s ipv6=off;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            expires 1y;
        }

        location = /index.html { expires -1; }
        location = /sw.js { expires -1; }
        location = /push-sw.js { expires -1; }
        location = /registerSW.js { expires -1; }
        location = /theme-init.js { expires -1; }
        location = /tokens.css { expires -1; }
        location = /shadows.css { expires -1; }
        location = /futur.css { expires -1; }
        location = /manifest.webmanifest { expires -1; }
        location ~ ^/(favicon\.svg|apple-touch-icon\.png|icon-(192|512|maskable-512)\.(png|svg))$ {
            expires -1;
        }

        location /api/v1/camera/hls/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        location /api/ {
            limit_req zone=homst_api burst=40 nodelay;
            limit_conn homst_conn 20;

            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        location /uploads/ {
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;

            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.spotify.com https://accounts.spotify.com https://lrclib.net https://api.open-meteo.com https://geocoding-api.open-meteo.com; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self';" always;
    }
}
