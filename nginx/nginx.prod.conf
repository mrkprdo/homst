events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # vite-plugin-pwa emits manifest.webmanifest; older mime.types don't map it
    types {
        application/manifest+json webmanifest;
    }

    server_tokens off;

    client_max_body_size 12M;

    # Per-IP request and connection limits. The connection zone also caps how
    # many concurrent SSE streams a single client can hold open.
    limit_req_zone $binary_remote_addr zone=homst_api:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=homst_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # ── HTTPS (port 8443) ──
    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/ssl/homst/cert.pem;
        ssl_certificate_key /etc/ssl/homst/key.pem;

        root /usr/share/nginx/html;
        index index.html;

        # Root CA certificate — download from the settings panel so phones and
        # browsers can trust this server's local HTTPS certificate.
        location = /ca.pem {
            alias /etc/ssl/homst/ca.pem;
            default_type application/x-pem-file;
            add_header Content-Disposition 'attachment; filename="homst-ca.pem"' always;
        }

        # Resolve the api upstream via Docker's embedded DNS at request time
        # (not at startup), so nginx boots and stays up regardless of whether
        # the api container is running yet — e.g. after a host reboot.
        resolver 127.0.0.11 valid=10s ipv6=off;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Hashed build output — safe to cache forever
        location /assets/ {
            expires 1y;
        }

        # App shell, service worker, manifest and icons: always revalidate so
        # new builds (and icon changes) are picked up automatically
        location = /index.html { expires -1; }
        location = /sw.js { expires -1; }
        location = /push-sw.js { expires -1; }
        location = /registerSW.js { expires -1; }
        location = /manifest.webmanifest { expires -1; }
        location ~ ^/(favicon\.svg|apple-touch-icon\.png|icon-(192|512|maskable-512)\.(png|svg))$ {
            expires -1;
        }

        location /api/ {
            limit_req zone=homst_api burst=40 nodelay;
            limit_conn homst_conn 20;

            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        location /uploads/ {
            # add_header is not inherited once a location declares any header,
            # so the ones that matter here are repeated explicitly.
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;

            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Spotify OAuth opens as a top-level navigation; img https: covers
        # album art/avatars; Vue needs inline styles for :style bindings.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.spotify.com https://accounts.spotify.com https://lrclib.net https://api.open-meteo.com https://geocoding-api.open-meteo.com; worker-src 'self'; manifest-src 'self';" always;
    }
}
