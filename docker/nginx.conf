# HOMST production nginx config — baked into the app image (see Dockerfile).
#
# nginx serves the built SPA from /usr/share/nginx/html and reverse-proxies
# the API, which runs inside the same container on 127.0.0.1:8000.
#
# Note: nginx/nginx.prod.conf is the legacy host-mount config for the old
# multi-container stack; it can be deleted once everyone has migrated.

user www-data;

worker_processes auto;

error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    server_tokens off;

    # vite-plugin-pwa emits manifest.webmanifest; older mime.types don't map it
    types {
        application/manifest+json webmanifest;
    }

    client_max_body_size 20M;

    # ── HTTPS (port 8443) ──
    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/ssl/homst/cert.pem;
        ssl_certificate_key /etc/ssl/homst/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        root /usr/share/nginx/html;
        index index.html;

        # Root CA certificate — download from the settings panel so phones and
        # browsers can trust this server's local HTTPS certificate.
        location = /ca.pem {
            alias /etc/ssl/homst/ca.pem;
            default_type application/x-pem-file;
            add_header Content-Disposition 'attachment; filename="homst-ca.pem"' always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Hashed build output — safe to cache forever
        location /assets/ {
            expires 1y;
        }

        # App shell, service worker, manifest and icons: always revalidate so
        # new builds (and icon changes) are picked up automatically
        location = /index.html { expires -1; }
        location = /sw.js { expires -1; }
        location = /push-sw.js { expires -1; }
        location = /registerSW.js { expires -1; }
        location = /manifest.webmanifest { expires -1; }
        location ~ ^/(favicon\.svg|apple-touch-icon\.png|icon-(192|512|maskable-512)\.(png|svg))$ {
            expires -1;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Server-sent events — never buffer
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        location /uploads/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
