; HOMST process supervisor — one container, four processes.
; Supervisord runs as PID 1 (via tini) and keeps each service alive
; independently; stops go top-down so nginx drains last.

[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; ── Redis (SSE fan-out + ARQ queue) ──────────────────────────────────
[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no
directory=/var/lib/redis
user=redis
priority=10
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; ── FastAPI (gunicorn + uvicorn workers) ─────────────────────────────
[program:api]
command=/opt/venv/bin/gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 4 --bind 127.0.0.1:8000 --access-logfile - --error-logfile -
directory=/app
user=homst
priority=20
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; ── ARQ worker (reminders, calendar sync) ────────────────────────────
[program:worker]
command=/opt/venv/bin/python -m arq app.workers.settings.WorkerSettings
directory=/app
user=homst
priority=20
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; ── nginx (TLS + SPA + reverse proxy) ────────────────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=30
autorestart=true
startsecs=1
stopsignal=QUIT
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
