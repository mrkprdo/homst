# One build workflow for both channels.
#
#   dev  → nightly images (:dev, :dev-<sha>)
#   other branch/tag → release images (:x.y.z, :x.y, and :latest for stable)
#
# Runs on a schedule (dev), on a pushed release tag, from the Release workflow,
# or manually from Actions → Build with a branch in the "Use workflow from"
# selector. A manual release branch should be named like `0.2.0` (or its HEAD
# should be tagged `v0.2.0`). If the tag does not exist, the workflow creates
# and pushes it automatically.
name: Build

on:
  schedule:
    # Nightly dev build at 03:00 UTC (uses the default branch).
    - cron: "0 3 * * *"
  push:
    # A pushed release tag builds that tag.
    tags:
      - "v*"
      - "*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build (defaults to the selected branch)"
        type: string
        required: false
  workflow_call:
    inputs:
      ref:
        description: "Branch or tag to build"
        type: string
        required: false

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ inputs.ref || (github.event_name == 'schedule' && 'dev' || github.ref_name) }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve build
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
      tags: ${{ steps.resolve.outputs.tags }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || (github.event_name == 'schedule' && 'dev' || github.ref_name) }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve dev or release
        id: resolve
        env:
          INPUT_REF: ${{ inputs.ref || (github.event_name == 'schedule' && 'dev' || github.ref_name) }}
        run: |
          set -eu
          ref="${INPUT_REF:-dev}"
          ref="${ref#refs/heads/}"
          ref="${ref#refs/tags/}"

          if [ "$ref" = "dev" ]; then
            short_sha="$(git rev-parse --short HEAD)"
            {
              echo "channel=dev"
              echo "version=dev"
              echo "tag="
              echo "ref=dev"
              echo "prerelease=false"
              echo "tags<<EOF"
              echo "type=raw,value=dev"
              echo "type=raw,value=dev-$short_sha"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Building dev images from $short_sha"
            exit 0
          fi

          tag=""
          if git rev-parse -q --verify "refs/tags/$ref" >/dev/null 2>&1; then
            tag="$ref"
          else
            candidate="${ref##*/}"
            candidate="${candidate#v}"
            if printf '%s' "$candidate" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
              tag="v$candidate"
            else
              tag="$(git tag --points-at HEAD | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$' | sort -V | tail -n1 || true)"
            fi
          fi

          if [ -z "$tag" ]; then
            echo "::error::No git tag found on '$ref'. Use the Release workflow, push a tag (e.g. git tag 0.2.0 && git push origin 0.2.0), or use a branch named like 0.2.0."
            exit 1
          fi

          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "::error::Tag '$tag' is not a semantic version (expected v0.2.0 or v0.2.0-rc.1)."
            exit 1
          fi

          head="$(git rev-parse HEAD)"
          existing="$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)"
          if [ -n "$existing" ]; then
            if [ "$existing" != "$head" ]; then
              echo "::error::Tag '$tag' already exists on a different commit. Bump the version or select the right ref."
              exit 1
            fi
          else
            git tag "$tag" "$head"
            git push origin "refs/tags/$tag"
          fi

          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          major_minor="$(printf '%s' "$version" | cut -d. -f1,2)"

          {
            echo "channel=release"
            echo "version=$version"
            echo "tag=$tag"
            echo "ref=$tag"
            echo "prerelease=$prerelease"
            echo "tags<<EOF"
            echo "type=raw,value=$version"
            echo "type=raw,value=$major_minor"
            if [ "$prerelease" = false ]; then
              echo "type=raw,value=latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Building release $version from $tag"

  checks:
    name: Checks
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.version.outputs.ref }}
      skip_image: true

  image:
    name: Build & push image
    needs: [version, checks]
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.version.outputs.ref }}
      version: ${{ needs.version.outputs.version }}
      tags: ${{ needs.version.outputs.tags }}

  release:
    name: GitHub Release
    if: needs.version.outputs.channel == 'release'
    needs: [version, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Stage env template asset
        # GitHub renames assets that start with a dot ("default.env.example")
        run: cp .env.example env.example

      - name: Create or update release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: |
            docker-compose.prod.yml
            env.example
          body: |
            ## Container image

            ```bash
            docker pull ${{ needs.image.outputs.image }}:${{ needs.version.outputs.version }}
            ```

            | | |
            |---|---|
            | Image | `${{ needs.image.outputs.image }}` |
            | Version | `${{ needs.version.outputs.version }}` |
            | Digest | `${{ needs.image.outputs.digest }}` |
            | Platforms | `linux/amd64`, `linux/arm64` |

            ### In-app updates

            This release is available to the in-app updater. HOMST pulls the
            exact version tag and keeps the previous stable image for rollback.

            ### Run it

            ```bash
            mkdir homst && cd homst
            curl -fLO https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/docker-compose.prod.yml
            docker compose -f docker-compose.prod.yml up -d
            ```

            > The repository and the GHCR container package must be public so
            > the release links, `docker pull`, and the in-app updater work
            > anonymously.
