# Reusable: build the app image for linux/amd64 + linux/arm64 and push it to
# GHCR. Called by the Build workflow. `tags` uses docker/metadata-action syntax.
name: Publish image

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (defaults to the caller's commit)"
        type: string
        required: false
      version:
        description: "Version value for the OCI label and HOMST_VERSION build arg"
        type: string
        required: false
        default: dev
      tags:
        description: "docker/metadata-action tag lines"
        type: string
        required: true
    outputs:
      image:
        description: "Image repository, e.g. ghcr.io/owner/homst"
        value: ${{ jobs.build.outputs.image }}
      version:
        value: ${{ jobs.build.outputs.version }}
      digest:
        value: ${{ jobs.build.outputs.digest }}
      tags:
        value: ${{ jobs.build.outputs.tags }}

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.names.outputs.image }}
      version: ${{ inputs.version }}
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Image name (GHCR requires lowercase)
        id: names
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags & labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.names.outputs.image }}
          tags: ${{ inputs.tags }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HOMST_VERSION=${{ inputs.version }}
            HOMST_COMMIT=${{ steps.commit.outputs.sha }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
          sbom: true
          provenance: true
