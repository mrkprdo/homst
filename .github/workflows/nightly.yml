# Nightly dev build: publishes ghcr.io/<owner>/homst:dev + :dev-<sha>.
#
# Scheduled workflows only ever run from the repository's default branch, so
# this file lives on the default branch but explicitly builds the `dev`
# branch. Run it by hand from the Actions tab whenever you want a fresh dev
# image without waiting for the schedule.
name: Nightly

on:
  schedule:
    # 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    with:
      ref: dev
      skip_image: true

  image:
    name: Build & push dev image
    needs: checks
    uses: ./.github/workflows/publish.yml
    with:
      ref: dev
      version: dev
      tags: |
        type=raw,value=dev
        type=sha,prefix=dev-,format=short
