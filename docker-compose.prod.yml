name: homst-prod

# Image tag for both app services. Compose reads `.env` automatically for
# interpolation, so setting HOMST_VERSION there is enough (e.g. dev or
# dev-<sha>). Exporting it in the shell also works and takes precedence.
x-image: &homst-image ghcr.io/mrkprdo/homst:${HOMST_VERSION:-latest}

# App configuration. `.env` is the documented file and takes precedence;
# `.env.prod` is loaded first only for installs that predate it.
x-env-files: &homst-env-files
  - path: .env.prod
    required: false
  - path: .env
    required: false

services:
  # ── One-shot: materialise the shared database password (first boot only) ──
  # Generates /secrets/db_password in the homst_secrets volume if missing, or
  # seeds it from POSTGRES_PASSWORD in .env when set; later boots reuse it
  # untouched.
  init:
    image: *homst-image
    build:
      context: .
    container_name: homst-init
    restart: "no"
    entrypoint: ["/bin/sh", "/docker/init-secrets.sh"]
    env_file: *homst-env-files
    volumes:
      - homst_secrets:/secrets

  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: homst-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: homst
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /secrets/db_password
    volumes:
      - pg_data:/var/lib/postgresql/data
      - homst_secrets:/secrets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d homst"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      init:
        condition: service_completed_successfully

  # ── HOMST — nginx + API + worker + Redis in one image ──
  # Pulled from GHCR by default; `make prod-build` (or plain `docker compose
  # build`) builds it from source instead.
  homst:
    image: *homst-image
    build:
      context: .
    container_name: homst
    restart: unless-stopped
    # Configuration comes from .env when present (see .env.example for every
    # key); without it the defaults apply — Redis inside this container, SQL
    # logging off, permissive CORS that only matters cross-origin.
    env_file: *homst-env-files
    environment:
      # In-app updates are performed by the optional "updater" service below.
      # Without the updates profile this URL is unreachable and the UI shows
      # the manual upgrade command instead.
      HOMST_UPDATER_URL: http://updater:9000
    ports:
      - "8443:8443"
    volumes:
      - photo_uploads:/app/uploads
      # CA + server certificate, generated on first boot (docker/homst-cert)
      - homst_ssl:/etc/ssl/homst
      # Database password generated by the init service above
      - homst_secrets:/secrets:ro
      # Prefer to manage certificates yourself? Drop homst_ssl above and use:
      #   - ./nginx/ssl:/etc/ssl/homst
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # ── Optional updater sidecar (enable with --profile updates) ──────────
  # It is the only container with access to the Docker socket. The app calls
  # it over the internal Compose network; nothing is published to the host.
  #
  #   docker compose -f docker-compose.prod.yml --profile updates up -d
  #
  # The updater pulls anonymously. The GHCR package must be public.
  updater:
    image: *homst-image
    profiles: ["updates"]
    container_name: homst-updater
    restart: unless-stopped
    entrypoint: ["/opt/venv/bin/uvicorn"]
    command: ["app.updater.main:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      HOMST_TARGET_CONTAINER: homst
      HOMST_STATE_DIR: /run/homst
    volumes:
      - ${HOMST_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - homst_updater_state:/run/homst
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pg_data:
  photo_uploads:
  homst_ssl:
  homst_secrets:
  homst_updater_state:
